<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111518">
{% if page.translation_key %}
  {% assign candidates = site.pages | concat: site.posts %}
  {% assign translations = candidates | where: "translation_key", page.translation_key %}
  {% for translation in translations %}
    <link rel="alternate" hreflang="{{ translation.locale }}" href="{{ translation.url | absolute_url }}">
    {% if translation.lang == "pt" %}<link rel="alternate" hreflang="x-default" href="{{ translation.url | absolute_url }}">{% endif %}
  {% endfor %}
{% endif %}
